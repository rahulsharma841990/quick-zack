<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuickZack – Databases</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      padding: 20px;
    }
    h1 { font-size: 18px; color: #58a6ff; margin-bottom: 16px; }
    .hint {
      font-size: 13px;
      color: #8b949e;
      padding: 16px;
      border: 1px dashed #30363d;
      border-radius: 8px;
      text-align: center;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 14px 16px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .card .title { font-weight: 600; }
    .card .sub { font-size: 12px; color: #8b949e; margin-top: 2px; }
    .btn {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #30363d;
      background: #21262d;
      color: #c9d1d9;
      font-size: 12px;
      cursor: pointer;
    }
    .btn:hover { background: #30363d; }
    .btn.primary { background: #1f6feb; border-color: #1f6feb; color: #fff; }
    .btn.primary:hover { background: #388bfd; }
  </style>
</head>
<body>
  <h1>&#128187; Databases</h1>
  <div class="hint">
    Database manager coming soon.<br>
    You will be able to connect via SSH tunnel to remote MySQL / PostgreSQL databases,<br>
    browse tables, and run queries — right from QuickZack.
  </div>
  <div style="margin-top:20px;">
    <div class="card">
      <div>
        <div class="title">Local MySQL (XAMPP)</div>
        <div class="sub">localhost:3306 &middot; root / (no password)</div>
      </div>
      <button class="btn primary" disabled>Connect</button>
    </div>
    <div class="card">
      <div>
        <div class="title">Add New Connection</div>
        <div class="sub">MySQL, PostgreSQL, or SQLite</div>
      </div>
      <button class="btn" disabled>+ Add</button>
    </div>
  </div>
</body>
</html>
